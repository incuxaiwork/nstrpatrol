services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nstrpatrol-postgres
    environment:
      POSTGRES_USER: nstrpatrol
      POSTGRES_PASSWORD: nstrpatrol
      POSTGRES_DB: nstrpatrol
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nstrpatrol -d nstrpatrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nstrpatrol-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nstrpatrol-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nstrpatrol
      MINIO_ROOT_PASSWORD: nstrpatrol-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
