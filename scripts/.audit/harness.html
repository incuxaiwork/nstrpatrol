<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>GIS admin-layer audit harness</title>
<link href="/ml/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; }
  #map { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as maplibregl from "/ml/maplibre-gl.mjs";

(async function () {
  const bundle = await (await fetch("/audit/layers-bundle.json")).json();
  const emptyStyle = () => ({
    version: 8,
    sources: {},
    layers: [
      { id: "gl-background", type: "background", paint: { "background-color": "#e8eaed" } },
    ],
  });
  const map = new maplibregl.Map({ container: "map", style: emptyStyle(), antialias: true });
  const empty = () => ({ type: "FeatureCollection", features: [] });

  // ---- layer stack mirrors web/components/map.tsx buildLayers (verbatim constants) ----
  function buildLayers() {
    for (const id of [
      "beats","markers","routes","heat","replay-trail","replay-head","replay-points",
      "compartments","blocks","block-labels","ranges","range-labels","compartment-labels",
      "boundary","grids","analysis-grid","sos-alerts",
    ]) map.addSource(id, { type: "geojson", data: empty() });

    map.addSource("tiles", { type: "raster", tiles: [], tileSize: 256, minzoom: 1, maxzoom: 16 });
    const BASEMAPS = ["gl-basemap-atlas","gl-basemap-street","gl-basemap-satellite","gl-basemap-terrain"];
    for (const [i, id] of BASEMAPS.entries()) {
      map.addLayer({ id, type: "raster", source: "tiles", paint: { "raster-opacity": 1 }, layout: { visibility: i === 0 ? "visible" : "none" } });
    }

    map.addLayer({ id: "gl-grids-fill", type: "fill", source: "grids", paint: { "fill-color": "#8a8f98", "fill-opacity": 0.05 } });
    map.addLayer({ id: "gl-grids-line", type: "line", source: "grids", minzoom: 5.5, paint: { "line-color": "#8a8f98", "line-width": ["interpolate", ["linear"], ["zoom"], 7, 0.5, 13, 1.1, 16, 1.6], "line-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0.2, 10, 0.45, 14, 0.75] } });
    map.addLayer({ id: "gl-grids-coverage", type: "fill", source: "grids", filter: ["!=", ["get", "coverageStatus"], null], paint: { "fill-color": ["case", ["==", ["get", "coverageStatus"], "covered"], "#2E7D32", ["==", ["get", "coverageStatus"], "uncovered"], "#B3261E", "#8a8f98"], "fill-opacity": 0.18 } });

    map.addLayer({ id: "gl-beats-coverage", type: "fill", source: "beats", filter: ["!=", ["get", "coveragePct"], null], paint: { "fill-color": "#2E7D32", "fill-opacity": ["interpolate", ["linear"], ["get", "coveragePct"], 0, 0.05, 100, 0.3] } });
    map.addLayer({ id: "gl-heat", type: "fill", source: "heat", paint: { "fill-color": "#B3261E", "fill-opacity": ["*", ["get", "intensity"], 0.32] } });

    map.addLayer({ id: "gl-compartments-fill", type: "fill", source: "compartments", paint: { "fill-color": "#E65100", "fill-opacity": 0.02 } });
    map.addLayer({ id: "gl-compartments-line", type: "line", source: "compartments", minzoom: 9.5, paint: { "line-color": "#B3261E", "line-width": 1, "line-dasharray": [4, 3], "line-opacity": 0.7 } });
    map.addLayer({ id: "gl-compartments-label", type: "symbol", source: "compartment-labels", minzoom: 11, layout: { "text-field": ["get", "compNo"], "text-size": 10, "text-allow-overlap": false }, paint: { "text-color": "#6A3AB2", "text-halo-color": "#ffffff", "text-halo-width": 1.5 } });

    map.addLayer({ id: "gl-blocks-fill", type: "fill", source: "blocks", paint: { "fill-color": "#5B2C6F", "fill-opacity": 0.07 } });
    map.addLayer({ id: "gl-blocks-outline", type: "line", source: "blocks", paint: { "line-color": "#5B2C6F", "line-width": 2, "line-opacity": 0.85 } });
    map.addLayer({ id: "gl-blocks-label", type: "symbol", source: "block-labels", minzoom: 7.5, layout: { "text-field": ["get", "name"], "text-size": 12, "text-allow-overlap": false }, paint: { "text-color": "#5B2C6F", "text-halo-color": "#ffffff", "text-halo-width": 2 } });

    map.addLayer({ id: "gl-beats-fill", type: "fill", source: "beats", paint: { "fill-color": "#1E4620", "fill-opacity": 0.02 } });
    map.addLayer({ id: "gl-auth-fill", type: "fill", source: "beats", filter: ["==", ["get", "isAuth"], true], paint: { "fill-color": "#B07D12", "fill-opacity": 0.08 } });
    map.addLayer({ id: "gl-auth-line", type: "line", source: "beats", filter: ["==", ["get", "isAuth"], true], paint: { "line-color": "#B07D12", "line-width": 2.5, "line-dasharray": [7, 5] } });
    map.addLayer({ id: "gl-beats-outline", type: "line", source: "beats", paint: { "line-color": ["case", ["boolean", ["get", "isZero"], false], "#B3261E", ["case", ["boolean", ["get", "selected"], false], "#B4450C", "#E65100"]], "line-width": ["case", ["boolean", ["get", "selected"], false], 3, 2.2], "line-opacity": 0.9 } });
    map.addLayer({ id: "gl-beats-zero-dash", type: "line", source: "beats", filter: ["==", ["get", "isZero"], true], paint: { "line-color": "#B3261E", "line-width": 3, "line-dasharray": [8, 6], "line-opacity": 0.85 } });
    map.addLayer({ id: "gl-beats-label", type: "symbol", source: "beats", minzoom: 9, layout: { "text-field": ["get", "name"], "text-size": 12, "text-allow-overlap": false }, paint: { "text-color": ["case", ["boolean", ["get", "isZero"], false], "#B3261E", "#C2410C"], "text-halo-color": "#ffffff", "text-halo-width": 2 } });

    map.addLayer({ id: "gl-ranges-outline", type: "line", source: "ranges", paint: { "line-color": "#0E4C92", "line-width": 3, "line-opacity": 0.95 } });
    map.addLayer({ id: "gl-ranges-label", type: "symbol", source: "range-labels", minzoom: 7.5, layout: { "text-field": ["get", "name"], "text-size": 14, "text-allow-overlap": false }, paint: { "text-color": "#0E4C92", "text-halo-color": "#ffffff", "text-halo-width": 2 } });

    map.addLayer({ id: "gl-boundary-line", type: "line", source: "boundary", paint: { "line-color": "#1B4332", "line-width": ["interpolate", ["linear"], ["zoom"], 8, 3.2, 14, 5.5], "line-opacity": 0.95 } });
    map.addLayer({ id: "gl-boundary-label", type: "symbol", source: "boundary", minzoom: 7, layout: { "text-field": ["get", "name"], "text-size": 13, "text-transform": "uppercase", "text-letter-spacing": 0.08, "text-allow-overlap": false }, paint: { "text-color": "#143d2b", "text-halo-color": "#ffffff", "text-halo-width": 2 } });

    map.addLayer({ id: "gl-agrid-fill", type: "fill", source: "analysis-grid", paint: { "fill-color": "#8a8f98", "fill-opacity": 0.07 } });
    map.addLayer({ id: "gl-agrid-line", type: "line", source: "analysis-grid", minzoom: 4.5, paint: { "line-color": "#8a8f98", "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.6, 14, 1.2], "line-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0.25, 12, 0.5] } });

    const setData = (id, fc) => map.getSource(id).setData(fc ?? empty());
    setData("beats", bundle.beats);
    setData("compartments", bundle.compartments);
    setData("compartment-labels", bundle.compartmentLabels);
    setData("blocks", bundle.blocks);
    setData("block-labels", bundle.blockLabels);
    setData("ranges", bundle.ranges);
    setData("range-labels", bundle.rangeLabels);
    setData("boundary", bundle.boundary);
  }

  function fitBoundsFromBeats() {
    const b = new maplibregl.LngLatBounds();
    for (const f of bundle.beats.features) {
      const coords = f.geometry.coordinates[0];
      for (const c of coords) b.extend(c);
    }
    map.fitBounds(b, { padding: 48, maxZoom: 13, duration: 0 });
  }

  function dump() {
    const toObj = (o) => { const r = {}; for (const k of Object.keys(o || {})) { try { r[k] = o[k]; } catch { r[k] = null; } } return r; };
    const layers = map.getStyle().layers.map((l) => ({
      id: l.id, source: l.source, type: l.type, minzoom: l.minzoom ?? null, filter: l.filter ?? null,
      visibility: l.layout?.visibility ?? "visible",
      paint: toObj(l.paint), layout: toObj(l.layout),
    }));
    const sources = {};
    for (const id of Object.keys(map.getStyle().sources)) {
      const src = map.getSource(id);
      if (src && src.type === "geojson") {
        let fc = [];
        try { fc = src.serialize?.().data?.features ?? src._data?.features ?? []; } catch {}
        const types = {};
        for (const x of fc) types[x.geometry?.type ?? "null"] = (types[x.geometry?.type ?? "null"] ?? 0) + 1;
        sources[id] = { type: "geojson", featureCount: fc.length, geomTypes: types };
      } else if (src && src.type === "raster") sources[id] = { type: "raster" };
    }
    const active = (zoom) => map.getStyle().layers.filter((l) => (l.minzoom ?? 0) <= zoom).map((l) => l.id);
    return {
      zoom: map.getZoom(),
      layers, sources,
      zoomGates: { at9_5: active(9.5), at10: active(10), at11: active(11) },
    };
  }

  map.on("load", () => {
    try {
      buildLayers();
      fitBoundsFromBeats();
      map.once("idle", () => {
        const fit = dump();
        window.__AUDIT__ = {
          stage: "fit", ...fit,
          labelCounts: {
            compartmentLabels: fit.sources["compartment-labels"]?.featureCount ?? null,
            blockLabels: fit.sources["block-labels"]?.featureCount ?? null,
            rangeLabels: fit.sources["range-labels"]?.featureCount ?? null,
            boundaryLabel: fit.sources["boundary"]?.featureCount ?? null,
            beatLabels: fit.sources["beats"]?.featureCount ?? null,
          },
          thresholds: [8.5, 9.0, 9.4, 9.5, 9.6, 10.0, 11.0, 12.0].map((z) => {
            const activeIds = map.getStyle().layers.filter((l) => (l.minzoom ?? 0) <= z && ["line", "symbol"].includes(l.type)).map((l) => l.id);
            return { z, activeIds };
          }),
        };
        document.title = "AUDIT_READY_" + map.getZoom().toFixed(2);
      });
    } catch (e) {
      window.__AUDIT__ = { stage: "error", error: String(e && e.message || e) };
      document.title = "AUDIT_ERROR";
    }
  });
})();
</script>
</body>
</html>
